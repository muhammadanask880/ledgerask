{% extends "base.html" %}
{% block title %}Contact — LedgerAsk{% endblock %}
{% block content %}
<section class="max-w-lg mx-auto px-6 py-16 fade-up">
    <div class="rounded-2xl border border-white/10 bg-surface card-glow p-8">
        <h1 class="font-display text-2xl font-bold mb-2">Contact</h1>
        <p class="text-slate-400 text-sm mb-7">
            This is a demo project — this form doesn't send anything anywhere. In a real
            deployment it would route to the team's support inbox.
        </p>

        <form class="space-y-4" onsubmit="event.preventDefault(); document.getElementById('sent').classList.remove('hidden');">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1.5">Name</label>
                <input type="text" placeholder="Jane Doe"
                       class="w-full rounded-lg bg-white/[0.04] border border-white/10 px-4 py-2.5 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-400/20 transition-all" />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1.5">Message</label>
                <textarea rows="4" placeholder="How can we help?"
                          class="w-full rounded-lg bg-white/[0.04] border border-white/10 px-4 py-2.5 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-400/20 transition-all"></textarea>
            </div>
            <button type="submit" class="w-full rounded-lg bg-gradient-to-r from-brand-500 to-brand-400 py-2.5 font-semibold text-white shadow-glow hover:brightness-110 transition-all">
                Send (demo only)
            </button>
        </form>
        <p id="sent" class="hidden mt-4 flex items-center gap-2 text-sm text-emerald-400">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            This is a demo — nothing was actually sent.
        </p>
    </div>
</section>
{% endblock %}
